<!doctype html>
<!--
  Source of web/public/og.jpeg (1200x630 Open Graph image) and .github/og.png (the README
  banner, the 2x render as-is). Outside public/, so it never ships.
  Mirrors the homepage hero: #faf9f6 page, the h1, and the preview screenshot.

  Render (any Chromium; 2x, then downscale so the panel text stays crisp):

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --force-device-scale-factor=2 --window-size=1200,630 \
      --allow-file-access-from-files --screenshot=/tmp/og@2x.png web/og/og.html
    sips -z 630 1200 -s format jpeg -s formatOptions 85 /tmp/og@2x.png --out web/public/og.jpeg
    cp /tmp/og@2x.png .github/og.png
-->
<meta charset="utf-8" />
<title>BetterCmdTab OG</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #faf9f6;
    color: #1c1b19;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    position: relative;
    padding: 64px 72px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .brand img {
    width: 52px;
    height: 52px;
  }

  h1 {
    margin-top: 36px;
    font-size: 72px;
    line-height: 1.02;
    font-weight: 700;
    letter-spacing: -0.04em;
  }

  /* The hero's selected headline word: SwitcherHeadline in web/src/routes/index.tsx. */
  .selected {
    display: inline-block;
    position: relative;
    z-index: 0;
    color: #2563eb;
  }

  .selected::before {
    content: "";
    position: absolute;
    inset: 0 -0.08em;
    z-index: -1;
    border-radius: 0.14em;
    background: rgb(37 99 235 / 0.13);
  }

  .meta {
    margin-top: 28px;
    font-size: 22px;
    color: #6f6a62;
  }

  /* Bleeds off the right and bottom edges, like the hero carousel peeking past the fold. */
  .shot {
    position: absolute;
    left: 680px;
    top: 270px;
    width: 760px;
    border-radius: 16px;
    border: 1px solid #e5e1d8;
    box-shadow: 0 24px 60px -20px rgb(28 27 25 / 0.35);
    overflow: hidden;
  }

  .shot img {
    display: block;
    width: 100%;
  }
</style>

<div class="brand"><img src="../public/icon.png" alt="" />BetterCmdTab</div>
<h1>The <span class="selected">⌘Tab</span><br />macOS deserves.</h1>
<p class="meta">Free and open source · macOS 13+</p>
<div class="shot"><img src="../public/screenshots/preview.jpg" alt="" /></div>
