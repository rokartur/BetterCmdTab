name: App CI

on:
  push:
    branches: [main]
    paths:
      - "BetterCmdTab/**"
      - "BetterCmdTabTests/**"
      - "BetterCmdTab.xcodeproj/**"
      - "web/src/docs/config-schema.json"
      - ".github/workflows/ci-app.yml"
      - "scripts/assert_tests_ran.sh"
  pull_request:
    paths:
      - "BetterCmdTab/**"
      - "BetterCmdTabTests/**"
      - "BetterCmdTab.xcodeproj/**"
      - "web/src/docs/config-schema.json"
      - ".github/workflows/ci-app.yml"
      - "scripts/assert_tests_ran.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lint
        run: |
          command -v swiftlint || brew install swiftlint
          swiftlint lint --strict --quiet --reporter github-actions-logging

  test:
    name: Unit tests
    # The Liquid Glass panel needs the macOS 26 SDK; macos-26 ships Xcode 26.x.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/spm
          key: spm-${{ hashFiles('BetterCmdTab.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Xcode build version
        id: xcode
        run: echo "build=$(plutil -extract ProductBuildVersion raw "$(xcode-select -p)/../version.plist")" >> "$GITHUB_OUTPUT"

      # Main's DerivedData makes the build incremental; PRs read it, main and manual runs refresh it.
      # shortcut: modules from a changed build setting pile up until the Xcode build in the key changes.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/dd
          key: dd-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ github.sha }}
          restore-keys: dd-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      # The tests run inside the app (TEST_HOST), so the host must be signed for
      # the bundle to load. Ad-hoc signing works without the team's certificate.
      - name: Test
        # GitHub's default bash has no pipefail, so a failing xcodebuild would
        # pass through xcbeautify as success.
        shell: bash -eo pipefail {0}
        run: |
          # Checkout makes every file newer than the cache, so Swift compares sources by hash.
          # The cached SDK modules make the stat cache redundant; rebuilding it cost 8-12 s.
          xcodebuild -project BetterCmdTab.xcodeproj -scheme "BetterCmdTab Debug" \
            -destination 'platform=macOS' -resultBundlePath TestResults.xcresult \
            -derivedDataPath "$RUNNER_TEMP/dd" -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -enable-incremental-file-hashing' SDK_STAT_CACHE_ENABLE=NO \
            test | xcbeautify --renderer github-actions

      - name: Assert the tests ran
        run: scripts/assert_tests_ran.sh TestResults.xcresult 300

      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/dd
          key: dd-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ github.sha }}

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TestResults
          path: TestResults.xcresult
