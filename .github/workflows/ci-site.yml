name: Site CI

# web/ is one TanStack Start app, marketing pages and docs, prerendered into a static
# tree that web/serve.ts serves (see web/Dockerfile). Beyond files it only 301s bare
# directories and /pl/*, and sets cache headers, so anything that used to be a server
# rule is a property of the built tree, and that is what gets checked here. A broken
# export must fail on the PR, not on the live domain.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/ci-site.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/ci-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint, format and types
        run: |
          bun run lint
          bun run format:check
          bun run types:check

      - name: Build
        run: bun run build

      - name: Verify the docs export
        run: |
          fail=0
          # Server routes, not pages: these must be files, or the search box and the
          # Markdown links 404.
          test -f out/docs/api/search                 || { echo "::error::static search index missing"; fail=1; }
          test -f out/docs/llms.mdx/docs/content.md    || { echo "::error::English markdown export missing"; fail=1; }
          test -f out/docs/llms.mdx/docs/pl/content.md || { echo "::error::Polish markdown export missing"; fail=1; }
          test -f out/docs/llms.txt                    || { echo "::error::llms.txt missing"; fail=1; }
          grep -q '<html lang="en"' out/docs/index.html    || { echo "::error::English document language missing"; fail=1; }
          grep -q '<html lang="pl"' out/docs/pl/index.html || { echo "::error::Polish document language missing"; fail=1; }
          # fumadocs' default URL puts the locale before the base (/pl/docs/...).
          wrong_locale=$(grep -rl '"/pl/docs' out/docs --include='*.html' || true)
          if [ -n "$wrong_locale" ]; then
            echo "::error::links with the locale before /docs in:"
            echo "$wrong_locale"
            fail=1
          fi
          # Machine-readable exports are read off-site, so root-relative links must be
          # canonical production URLs.
          machine_exports="out/docs/llms.txt out/docs/llms-full.txt $(find out/docs/llms.mdx -type f -name '*.md')"
          relative_links=$(grep -nHE '(\]\(|href=")/[^/]' $machine_exports || true)
          if [ -n "$relative_links" ]; then
            echo "::error::machine-readable exports contain root-relative links:"
            echo "$relative_links"
            fail=1
          fi
          for u in $(grep -hoE 'https://bettercmdtab\.app/docs/[^)"[:space:]]*' $machine_exports | sort -u); do
            relative=${u#https://bettercmdtab.app/docs/}
            fragment=
            case "$relative" in
              *#*) fragment=${relative#*#}; relative=${relative%%#*} ;;
            esac
            [ -n "$relative" ] && page="out/docs/${relative%/}/index.html" || page=out/docs/index.html
            test -f "$page" || { echo "::error::machine-readable export links to missing $u"; fail=1; continue; }
            [ -z "$fragment" ] || grep -qF "id=\"$fragment\"" "$page" \
              || { echo "::error::machine-readable export links to missing fragment $u"; fail=1; }
          done
          # Content links in a translated page must not silently switch the reader back
          # to the unprefixed English tree.
          bad_links=$(grep -rho 'href="/docs/[^"]*"' out/docs/pl --include='*.html' \
                        | sed 's/^href="//; s/"$//' \
                        | grep -Ev '^/docs/(pl/|icon-64\.png)' \
                        | sort -u || true)
          if [ -n "$bad_links" ]; then
            echo "::error::Polish pages link to English docs paths:"
            echo "$bad_links"
            fail=1
          fi
          # Every og:image the pages advertise must actually be on disk.
          for u in $(grep -rho 'og:image" content="https://bettercmdtab.app\([^"]*\)"' out/docs --include='*.html' \
                     | sed 's|.*bettercmdtab.app||; s|"$||' | sort -u); do
            test -f "out${u}" || { echo "::error::og:image ${u} has no file"; fail=1; }
          done
          # Every page is reachable at more than one URL, so a missing canonical lets the
          # duplicates split ranking signals. This shipped broken once.
          for f in $(find out/docs -name 'index.html'); do
            grep -q 'rel="canonical"' "$f" || { echo "::error::$f has no rel=canonical"; fail=1; }
            grep -q 'og:url' "$f"          || { echo "::error::$f has no og:url"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "docs export OK"
          exit $fail

      # web/serve.ts serves this tree as is, so the guarantees below are properties of
      # the files themselves, checked without booting a server.
      - name: Verify the artifact
        run: |
          root=out
          fail=0

          # serve.ts answers a URL ending in a slash with <path>/index.html and 301s the
          # bare form to it. So every sitemap entry must end in a slash AND have that
          # exact file, or the sitemap advertises a redirect or a 404, both worse than
          # not listing the page at all.
          for u in $(grep -o '<loc>[^<]*</loc>' public/sitemap.xml \
                     | sed 's|</*loc>||g; s|https://bettercmdtab.app||'); do
            case "$u" in
              */) ;;
              *) echo "::error::sitemap URL '$u' has no trailing slash, serve.ts would 301 it"; fail=1; continue;;
            esac
            test -f "${root}${u%/}/index.html" \
              || { echo "::error::sitemap lists $u but ${root}${u%/}/index.html does not exist"; fail=1; }
          done

          # An internal link to a redirecting URL spends a hop and dilutes the signal it
          # passes. Same slash rule as above.
          for h in $(grep -oh 'href="/docs[^"]*"' $root/index.html $root/404.html $root/alttab-alternative/index.html $root/cmd-tab-mac/index.html $(find $root/docs -name index.html) \
                     | sed 's|href="||; s|"||' | sed 's|#.*||' | grep -v '\.png$' | sort -u); do
            case "$h" in
              */) test -f "${root}${h%/}/index.html" \
                    || { echo "::error::a page links to $h, which has no page"; fail=1; };;
              *) echo "::error::a page links to $h without a trailing slash (301 in serve.ts)"; fail=1;;
            esac
          done

          # serve.ts answers every missing path on the origin, docs included, with it.
          test -f $root/404.html || { echo "::error::404.html missing from the artifact"; fail=1; }

          [ "$fail" = 0 ] && echo "artifact OK"
          exit $fail

      # The sitemap is hand-maintained while the docs pages are generated from
      # content/docs, so the two drift apart silently: a renamed page becomes a sitemap
      # 404, a new one never gets submitted. Guard both directions.
      - name: Verify the sitemap matches the docs content
        run: |
          fail=0
          for file in content/docs/*/*.mdx; do
            locale=$(basename "$(dirname "$file")")
            slug=$(basename "$file" .mdx)
            prefix="https://bettercmdtab.app/docs"
            [ "$locale" = en ] || prefix="$prefix/$locale"
            if [ "$slug" != index ]; then url="$prefix/$slug/"
            else url="$prefix/"; fi
            grep -qF "<loc>$url</loc>" public/sitemap.xml \
              || { echo "::error::$url is missing from web/public/sitemap.xml"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "sitemap covers every docs page"
          exit $fail
